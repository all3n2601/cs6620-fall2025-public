name: Docker Build, Push, and Deploy

on:
  push:
    branches: [week02]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-week02
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record build time
        id: clock
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ steps.clock.outputs.created }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_RUN_ID=${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.clock.outputs.created }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS Learner Lab credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy to EC2 through SSM and verify execution
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app
          DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shlex
          image = shlex.quote(os.environ['IMAGE'])
          pinned = shlex.quote(os.environ['IMAGE'] + '@' + os.environ['DIGEST'])
          revision = shlex.quote(os.environ['REVISION'])
          commands = [
              'set -eu',
              f'docker pull {image}:latest',
              f'docker pull {pinned}',
              f'test "$(docker image inspect {pinned} --format \'{{{{index .Config.Labels "org.opencontainers.image.revision"}}}}\')" = {revision}',
              'docker stop cs6620-app || true',
              'docker rm cs6620-app || true',
              f'docker run -d --name cs6620-app --restart unless-stopped -p 80:5000 {pinned}',
              'ready=0; for attempt in $(seq 1 30); do if curl -fsS http://127.0.0.1/health > /tmp/cs6620-health.json; then ready=1; break; fi; sleep 2; done; test "$ready" = 1',
              'python3 -c \'import json; h=json.load(open("/tmp/cs6620-health.json")); assert h["version"] == "2.0" and h["deployment_method"] == "automated" and h["revision"] == "' + os.environ['REVISION'] + '"\'',
              'date -u',
              'cat /tmp/cs6620-health.json',
              f'docker images --digests {image}',
              f'docker image inspect {pinned} --format \'{{{{json .Config.Labels}}}}\' | python3 -m json.tool',
              'docker ps --format "{{.Names}}\\t{{.Status}}\\t{{.CreatedAt}}"',
              'docker logs --tail 15 cs6620-app 2>&1',
          ]
          with open('ssm-parameters.json', 'w') as f:
              json.dump({'commands': commands, 'executionTimeout': ['600']}, f)
          PY
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --comment "GitHub Actions run $RUN_ID deployment $REVISION" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"
          echo "SSM command: $COMMAND_ID" >> "$GITHUB_STEP_SUMMARY"
          status=Pending
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          test "$status" = Success
